name: keyper
description: A utility app for keeping secrets and many more.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  app_logger:
    path: packages/app_logger
  app_ui:
    path: packages/app_ui
  bloc: ^9.0.1
  bloc_concurrency: ^0.3.0
  call_log_repository:
    path: packages/call_log_repository
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  go_router: ^16.2.4
  hydrated_bloc: ^10.1.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  permission_client:
    path: packages/permission_client
  shared_preferences: ^2.5.3
  storage:
    path: packages/storage
  stream_transform: ^2.1.1

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.1
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true

<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="32" viewBox="0 0 240 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KEYPER logo dark">
  <title>KEYPER Logo (Dark)</title>
  <defs>
    <linearGradient id="gradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6A00;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#EE0979;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="none">
    <!-- Key mark with gradient -->
    <g id="mark">
      <circle cx="18" cy="16" r="8" fill="url(#gradDark)" />
      <rect x="30" y="14" width="40" height="4" rx="2" fill="url(#gradDark)" />
      <rect x="72" y="14" width="4" height="6" rx="1" fill="url(#gradDark)" />
      <rect x="80" y="14" width="4" height="4" rx="1" fill="url(#gradDark)" />
    </g>

    <!-- Wordmark -->
    <text x="96" y="22" fill="#000000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">
      KEYPER
    </text>
  </g>
</svg>